# Avatar proxy is fetched directly by <img> tags, which can't send the
# Authorization header. Allow unauthenticated access — the function
# only returns image bytes for a given user id and never echoes any
# secret URL back to the client.
[functions.avatar-proxy]
verify_jwt = false

# World Pulse is the Vibeverse's public heartbeat, fetched cross-origin
# by other sites (e.g. the Vibe Ventures Studio globe) with a plain GET
# and no Supabase client. It returns a narrow read-only shape: agent
# names/statuses, activity counts, recent event lines — never ids,
# message bodies, or payloads.
[functions.world-pulse]
verify_jwt = false

# The Vibe Times is read by three surfaces that are not Supabase clients:
# the /times page, the front-door strip, and a canvas texture on the
# newsstand in the plaza. They fetch it as a plain GET with no headers.
# The POST that writes an issue is left open on purpose — the day is
# claimed with a unique constraint before the model is called, so extra
# pokes are free — and only a caller holding the service-role key can
# force a rewrite.
[functions.vibe-times]
verify_jwt = false
