project_id = "efdqqnubowgwsnwvlalp"

# Avatar proxy is fetched directly by <img> tags, which can't send the
# Authorization header. Allow unauthenticated access — the function
# only returns image bytes for a given user id and never echoes any
# secret URL back to the client.
[functions.avatar-proxy]
verify_jwt = false

# World Pulse is the Vibeverse's public heartbeat, fetched cross-origin
# by other sites (e.g. the Vibe Ventures Studio globe) with a plain GET
# and no Supabase client. It returns a narrow read-only shape: agent
# names/statuses, activity counts, recent event lines — never ids,
# message bodies, or payloads.
[functions.world-pulse]
verify_jwt = false

# The Vibe Times is read by three surfaces that are not Supabase clients:
# the /times page, the front-door strip, and a canvas texture on the
# newsstand in the plaza. They fetch it as a plain GET with no headers.
# The POST that writes an issue is left open on purpose — the day is
# claimed with a unique constraint before the model is called, so extra
# pokes are free — and only a caller holding the service-role key can
# force a rewrite.
[functions.vibe-times]
verify_jwt = false

# Sign in with a wallet. The caller has no session yet — that is the entire
# point — so there is no JWT to verify. The credential is a signature over a
# server-issued, single-use nonce, checked in the function body against the
# exact bytes we handed out.
[functions.wallet-auth]
verify_jwt = false

# The read-aloud button is on a public page, so the endpoint behind it has
# to be too. It is not an open text-to-speech service: it will only ever
# read an issue that is already published, it builds the script itself
# rather than speaking whatever it is handed, and it synthesises each
# edition once and serves the stored file afterwards.
[functions.vibe-times-read]
verify_jwt = false

# Exploring pays. Guests earn coins for arriving in a world exactly like
# signed-in players do — the whole point is that a visitor collects a
# passport before they have any idea what an account is — so there is no
# session to verify. Nothing here trusts the caller with anything that
# matters: the payout is once per world per wallet, enforced by a primary
# key, and bounded by a per-wallet ceiling rather than by who is asking.
[functions.vibe-explore]
verify_jwt = false

[functions.ugc-report]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.bot-forge]
verify_jwt = false

[functions.gatch-clip]
verify_jwt = false
